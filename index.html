<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Itinéraires de voyage</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f1117;
    --bg2:       #181c25;
    --bg3:       #1f2433;
    --border:    rgba(255,255,255,0.08);
    --border2:   rgba(255,255,255,0.14);
    --text:      #e8e6df;
    --text2:     #9b9890;
    --text3:     #6b6860;
    --accent1:   #4ecca3;   /* teal */
    --accent2:   #a78bfa;   /* purple */
    --accent3:   #f6a623;   /* amber */
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    padding: 64px 24px 80px;
  }

  header {
    max-width: 780px;
    margin: 0 auto 56px;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(30px, 5vw, 48px);
    font-weight: 400;
    letter-spacing: -0.5px;
    color: var(--text);
    line-height: 1.15;
    margin-bottom: 12px;
  }

  header h1 span {
    color: var(--accent1);
  }

  header p {
    font-size: 14px;
    color: var(--text3);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .grid {
    max-width: 780px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }

  .card {
    display: block;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 26px 22px;
    text-decoration: none;
    color: var(--text);
    transition: border-color .2s, transform .2s;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px;
    height: 100%;
    background: var(--accent-color, var(--accent1));
    opacity: 0.7;
  }

  .card:hover {
    border-color: var(--border2);
    transform: translateY(-2px);
  }

  .card .flag {
    font-size: 26px;
    margin-bottom: 14px;
    display: block;
  }

  .card .country {
    font-family: 'Playfair Display', serif;
    font-size: 19px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .card .meta {
    font-size: 12.5px;
    color: var(--text2);
    line-height: 1.5;
  }

  .card.placeholder {
    background: transparent;
    border: 1.5px dashed var(--border);
    color: var(--text3);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 13px;
    cursor: default;
  }

  .card.placeholder:hover { transform: none; border-color: var(--border); }
  .card.placeholder::before { display: none; }

  footer {
    max-width: 780px;
    margin: 56px auto 0;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text3);
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>Nos <span>itinéraires</span> de voyage</h1>
  <p>Plein air · Paysages · Gastronomie locale</p>
</header>

<div class="grid">

  <a class="card" href="vietnam.html" style="--accent-color: var(--accent1)">
    <span class="flag">🇻🇳</span>
    <div class="country">Vietnam</div>
    <div class="meta">3 itinéraires d'un mois — nord, centre, sud</div>
  </a>

  <a class="card" href="perou.html" style="--accent-color: var(--accent2)">
    <span class="flag">🇵🇪</span>
    <div class="country">Pérou</div>
    <div class="meta">Itinéraire(s) — voir la page</div>
  </a>

  <div class="card placeholder">
    Prochaine destination à venir
  </div>

</div>

<footer>
  Itinéraires de voyage · Plein air &amp; gastronomie locale · Généré avec Claude
</footer>

</body>
</html>
